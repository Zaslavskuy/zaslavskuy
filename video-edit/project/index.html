      /* ── camera ─────────────────────────────────────────────
         #cam is the full-frame speaker. Layouts are GSAP states on it
         (scale / y / clip-path), set on the jump-cut frames so the layout
         change hides the cut. #cam-frame is the shadow box behind the
         windowed (stack) layout: 864×840 at (108,110). */
      #cam-frame {
        position: absolute; left: 108px; top: 110px; width: 864px; height: 840px;
        border-radius: var(--r); background: #000; box-shadow: var(--shadow-soft);
      }
      #cam { position: absolute; inset: 0; transform-origin: 50% 0; }
      #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* ── shared by scene sub-compositions ── */
      .panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); color: var(--ink); }
      /* panel under the windowed speaker; bottom edge ~20% of frame height above the bottom */
      .stack-panel {
        position: absolute; left: 70px; top: 1000px; width: 940px; height: 540px;
        padding: 56px; box-shadow: var(--shadow-soft);
      }
      .title { font-size: 60px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
      /* bottom chips sit ~20% of frame height above the bottom edge */
      .bottom-zone {
        position: absolute; left: 0; right: 0; bottom: 384px;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
      }
      .chip {
        display: flex; align-items: center; gap: 18px;
        padding: 24px 42px; border-radius: var(--r);
        font-size: 46px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.15;
      }
      .chip .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); flex: none; }
      .chip-accent { background: var(--accent); color: #ffffff; font-weight: 600; box-shadow: var(--shadow); }
