<!doctype html>
<html><head><meta charset="utf-8">
<title>Reels overlay</title>
<style>
@font-face{font-family:Osw;src:url(assets/fonts/oswald-cyr.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-weight:200 700}
@font-face{font-family:Osw;src:url(assets/fonts/oswald-lat.woff2) format('woff2');font-weight:200 700}
@font-face{font-family:Mont;src:url(assets/fonts/mont-cyr.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;font-weight:100 900}
@font-face{font-family:Mont;src:url(assets/fonts/mont-lat.woff2) format('woff2');font-weight:100 900}
:root{--red:#FFB21E;--green:#39ff5a}
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
#root{position:relative;width:720px;height:1280px;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.abs{position:absolute}
/* ---------- subtitles ---------- */
#subs{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:0;width:720px;display:none;flex-direction:column;align-items:center;transform:translateY(-50%)}
.line{display:flex;gap:.22em;justify-content:center;white-space:nowrap;position:relative}
.w{display:inline-block;transform-origin:50% 60%;will-change:auto}
.ls{font:600 32px/1.1 Mont;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65),0 0 3px rgba(0,0,0,.5)}
.lb,.lr{font:600 78px/0.98 Osw;text-transform:uppercase;letter-spacing:.5px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.45),0 0 3px rgba(0,0,0,.35)}
.lr{color:var(--red);text-shadow:0 0 2px rgba(0,0,0,.75),0 3px 6px rgba(0,0,0,.45),0 4px 22px rgba(0,0,0,.6)}
.strike{position:absolute;left:-6px;right:-6px;top:52%;height:7px;background:var(--red);transform-origin:0 50%;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
/* ---------- dashboard ---------- */
#dash{background:#101010}
#dash .cam{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 40%}
#dash .world{position:absolute;left:360px;top:640px;width:0;height:0;transform-style:preserve-3d}
.floor{position:absolute;left:-2000px;top:-2400px;width:4000px;height:4800px;background-color:#141414;
  background-image:linear-gradient(#2a2a2a 2px,transparent 2px),linear-gradient(90deg,#2a2a2a 2px,transparent 2px);background-size:90px 90px}
.panel{position:absolute;width:560px;height:340px;background:#c9c9c9;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:visible;transition:none}
.panel .sk{position:absolute;height:9px;border-radius:5px;background:#9c9c9c}
.panel svg{position:absolute;left:24px;top:150px}
.kpi{position:absolute;width:150px;height:62px;border-radius:8px}
.kpi .sk{position:absolute}
.kl{position:absolute;left:10px;top:9px;font:600 10px/1 Mont;color:#666;white-space:nowrap}
.kv{position:absolute;left:10px;top:29px;font:700 19px/1 Mont;color:#333;white-space:nowrap;letter-spacing:-.2px}
.pt{position:absolute;left:24px;top:18px;font:700 15px/1 Mont;color:#4a4a4a}
.glow .kl{color:#444}.glow .kv{color:#111}
.glow{background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.85),0 0 60px 10px rgba(255,255,255,.35)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.08) 30%,rgba(0,0,0,.8) 100%)}
/* ---------- diagram / browser bg ---------- */
.darkbg{background:radial-gradient(ellipse at 50% 42%,#3d3f43 0%,#2a2b2e 45%,#1b1c1e 100%)}
#diag .world,#brow .world{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0}
.icon{position:absolute;width:170px;height:170px;transform-origin:50% 50%}
.label{position:absolute;width:300px;text-align:center;font:800 30px/1 Mont;color:#fff;text-transform:uppercase;letter-spacing:.3px;transform-origin:50% 50%}
svg .wst{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg .rst{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
/* browser */
#brow .stage{position:absolute;inset:0;perspective:1400px}
#brow .tilt{position:absolute;inset:0;transform-style:preserve-3d}
.win{position:absolute;left:40px;top:440px;width:640px;height:440px;background:#e7e7e7;border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.6);transform-origin:50% 0;overflow:hidden}
.win .bar{height:40px;background:#d3d3d3;display:flex;align-items:center;gap:8px;padding-left:16px}
.win .dot{width:11px;height:11px;border-radius:50%;background:#b5b5b5}
.win .url{margin-left:16px;flex:1;margin-right:16px;height:20px;border-radius:10px;background:#efefef}
.win .txt{position:absolute;left:0;right:0;top:120px;text-align:center}
.win .txt span{display:inline-block;font:700 30px/1 Mont;color:#fff;background:#b3b3b3;padding:10px 16px;border-radius:4px;letter-spacing:1px;white-space:pre}
.win .skr{position:absolute;height:12px;border-radius:6px;background:#d6d6d6}
.head{position:absolute;left:0;width:720px;text-align:center;font:600 104px/1 Osw;text-transform:uppercase;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.4);transform-origin:50% 100%}
.head.red{color:var(--red);text-shadow:0 0 2px rgba(0,0,0,.6),0 6px 24px rgba(0,0,0,.5)}
/* avatar + card */
#avatar{position:absolute;left:300px;top:760px;width:124px;height:124px;border-radius:50%;display:none;box-sizing:border-box;border:6px solid #3fbf4a;background:rgba(30,30,30,.35);backdrop-filter:blur(4px);overflow:hidden}
#pcard{position:absolute;left:28px;top:64px;width:664px;height:306px;border-radius:30px;background:rgba(12,12,14,.52);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;color:#fff;font-family:Mont,'Noto Color Emoji';overflow:hidden}
#pcard .un{position:absolute;left:28px;top:22px;font:700 25px/1 Mont;letter-spacing:.2px}
#pcard .dots{position:absolute;right:26px;top:16px;font:700 26px/1 Mont;letter-spacing:2px}
#pcard .av{position:absolute;left:24px;top:66px;width:112px;height:112px;border-radius:50%;padding:4px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
#pcard .av img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid rgba(20,20,22,.9);box-sizing:border-box;transform:scale(1)}
#pcard .nm{position:absolute;left:162px;top:72px;right:20px;font:700 18px/1.25 Mont,'Noto Color Emoji'}
#pcard .st{position:absolute;left:162px;top:124px;display:flex;gap:30px}
#pcard .st b{display:block;font:700 24px/1 Mont}#pcard .st span{display:block;font:500 14px/1.4 Mont;color:rgba(255,255,255,.85)}
#pcard .bio{position:absolute;left:28px;top:192px;right:20px;font:500 15px/1.35 Mont,'Noto Color Emoji';color:rgba(255,255,255,.92)}
#pcard .bio a{color:#9db8ff;text-decoration:none;font-weight:600}
#pcard .btn{position:absolute;left:24px;width:300px;bottom:18px;height:42px;border-radius:12px;background:#0095f6;color:#fff;font:700 17px/42px Mont;text-align:center;overflow:hidden}
#pcard .btn2{position:absolute;right:24px;width:300px;bottom:18px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font:700 17px/42px Mont;text-align:center}
#pcard .rip{position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.55);left:50%;top:50%}
#cursor{position:absolute;width:34px;height:34px;display:none}
</style></head>
<body><div id="root">
  <div id="dash" class="scene"><div class="cam"><div class="world" id="dworld"><div class="floor"></div></div></div><div class="vig"></div></div>
  <div id="diag" class="scene darkbg"><div class="world" id="gworld"></div></div>

  <div id="subs"></div>
  <div id="avatar"><svg viewBox="0 0 100 100" width="112" height="112"><circle cx="50" cy="38" r="17" fill="#fff"/><path d="M18 92 C20 66 34 60 50 60 C66 60 80 66 82 92Z" fill="#fff"/></svg></div>
  <div id="pcard"><div class="un">zaslavskuy</div><div class="dots">•••</div>
    <div class="av"><img src="assets/ig_avatar.jpg"></div>

</div>
<script>
// ================= helpers =================
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3);
const eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const mix=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id);
function el(tag,cls,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
// piecewise keyframes [[t,v],...] with easing between
function kf(t,keys,ease=eInOut){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];const p=ease((t-a)/(b-a));return Array.isArray(va)?va.map((v,j)=>mix(v,vb[j],p)):mix(va,vb,p)}}return keys[keys.length-1][1]}
// pop-in transform for an element appearing at time `at`
function pop(t,at,dur=.16,from=.6){const p=lin(t,at,at+dur);return{o:t<at?0:clamp(p*2.2),s:from+(1-from)*eBack(p),b:(1-p)*5}}
function applyPop(e,t,at,extra='',dur,from){const q=pop(t,at,dur,from);e.style.opacity=q.o;e.style.transform=`${extra} scale(${q.s})`;e.style.filter=q.b>.05?`blur(${q.b}px)`:'none'}
function svgEl(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

// ================= SUBTITLES =================
// line kinds: s = small, b = big white, r = big red. tokens: [text, appearTime]
const SUB_Y=t=>t<3.42?0.625:t<7.40?0.58:t<11.40?0.505:0.545;
const CARDS=[
 [0.00,0.80,[['b',[['Боитесь',0.00]]],['s',[['заказать',0.30]]]]],
 [0.80,1.16,[['b',[['сайт',0.80]]],['s',[['заказать',0.0]]]]],
 [1.16,2.08,[['s',[['потому',1.16],['что',1.36]]],['b',[['думаете',1.56]]]]],
 [2.08,2.42,[['s',[['что',2.08],['он',2.26]]]]],
 [2.42,3.42,[['s',[['не',2.42],['даст',2.54]]],['b',[['результатов',2.76]]],'strike',2.98]],
 [3.42,4.44,[['s',[['тогда',3.42]]],['b',[['посмотрите',3.84]]]]],
 [4.44,5.44,[['b',[['какие',4.44]]],['s',[['результаты',4.74]]]]],
 [5.44,6.54,[['s',[['получают',5.44]]],['b',[['наши',5.86],['клиенты',6.04]]]]],
 [6.54,7.40,[['s',[['прямо',6.54]]],['b',[['сейчас',6.82]]]]],
 [7.40,8.34,[['s',[['конечно,',7.56]]]]],
 [8.34,9.34,[['b',[['такой',8.34]]],['s',[['результат',8.68]]]]],
 [9.34,10.16,[['s',[['это',9.34],['когда',9.62]]],['r',[['всё',9.86]]]]],
 [10.16,11.40,[['b',[['работает',10.16]]],['s',[['в',10.60],['связке',10.84]]]]],
 [15.36,15.92,[['b',[['наша',15.16]]],['s',[['задача',15.62]]]]],
 [20.28,21.14,[['s',[['для',20.28],['того,',20.82],['чтобы',20.98]]]]],
 [21.14,22.58,[['b',[['клиент',21.14]]],['s',[['понял',21.56],['предложение',21.82]]]]],
 [22.58,23.92,[['b',[['клиент',21.14]]],['s',[['доверился',22.58],['бизнесу',23.18]]]]],
 [23.92,24.96,[['b',[['клиент',21.14]]],['s',[['оформил',23.92],['заказ',24.48]]]]],
 [24.96,26.26,[['s',[['поэтому',24.96]]],['b',[['не',25.40],['бойтесь',25.82]]]]],
 [26.26,27.20,[['s',[['инвестировать',26.26],['в',26.76],['сайт',26.96]]],['b',[['не бойтесь',25.40]]]]],
 [27.20,28.24,[['b',[['это',27.20],['разовая',27.70]]]]],
 [28.24,28.80,[['b',[['это разовая',27.20]]],['s',[['инвестиция',28.24]]]]],
 [28.80,29.42,[['r',[['в',28.80],['инструмент',28.84]]],['s',[['инвестиция',28.24]]]]],
 [29.42,29.74,[['r',[['в инструмент',28.80]]],['s',[['который',29.42]]]]],
 [29.74,30.62,[['r',[['в инструмент',28.80]]],['s',[['продолжает',29.74],['работать',30.36]]]]],
 [30.62,30.98,[['r',[['в инструмент',28.80]]],['s',[['на',30.62],['ваш',30.86]]]]],
 [30.98,31.28,[['b',[['бизнес',30.98]]],['s',[['на ваш',30.62]]]]],
 [31.28,32.58,[['s',[['и',31.28],['приносит',31.56],['вам',31.98]]],['b',[['заявки',32.12]]]]],
 [32.58,33.28,[['s',[['даже',32.58],['тогда,',32.80]]]]],
 [33.28,33.58,[['s',[['когда',33.28]]]]],
 [33.58,34.68,[['s',[['вы',33.58]]],['b',[['не',33.82],['онлайн',34.04]]]]],
 [34.68,35.16,[['b',[['если',34.68]]]]],
 [35.16,35.36,[['b',[['тебе',35.16]]]]],
 [35.36,36.06,[['s',[['нужен',35.36]]],['b',[['сайт',35.60]]]]],
 [36.06,37.12,[['b',[['оставляй',36.06]]],['s',[['заявку',36.64]]]]],
 [37.12,39.40,[['s',[['обсудим',37.12],['решение',37.70],['именно',38.12]]],['b',[['для',38.48],['тебя',38.70]]]]],
];
const cardEls=[];
(function buildSubs(){const root=$('subs');
 for(const c of CARDS){const ce=el('div','card',root);const words=[];let strike=null;
  for(const L of c[2]){if(L==='strike'||typeof L==='number')continue;const le=el('div','line l'+L[0],ce);
   for(const [txt,at] of L[1]){const w=el('span','w',le);w.textContent=L[0]==='s'?txt.toLowerCase():txt.toUpperCase();words.push([w,at])}
   if(c[2].includes('strike')&&L[0]==='b'){strike=el('div','strike',le)}}
  const si=c[2].indexOf('strike');cardEls.push({c,ce,words,strike,strikeAt:si>=0?c[2][si+1]:0})}})();
function renderSubs(t){const y=SUB_Y(t)*1280;
 for(const k of cardEls){const on=t>=k.c[0]&&t<k.c[1];k.ce.style.display=on?'flex':'none';if(!on)continue;k.ce.style.top=y+'px';
  for(const [w,at] of k.words)applyPop(w,t,at,'',.15,.55);
  if(k.strike){const p=eOut(lin(t,k.strikeAt,k.strikeAt+.2));k.strike.style.transform=`scaleX(${p})`;k.strike.style.opacity=p>0?1:0}}}

// ================= DASHBOARD (3.42–7.40) =================
const DASH=[3.42,7.40];
const dpan=[];
function chartPath(seed,w,h,n=46,spikes=true){const r=rng(seed);let pts=[];for(let i=0;i<n;i++){let v=.18+r()*.22;if(spikes&&r()<.16)v+=.35+r()*.35;pts.push([i/(n-1)*w,h-v*h])}return'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}
const DATA=[['329 415,75 ₴','1 508'],['386 942,10 ₴','1 836'],['147 860,40 ₴','1 124']];
(function buildDash(){const W=$('dworld');
 const layout=[[-580,-1150],[20,-1150],[-580,-770],[20,-770],[-580,-390],[20,-390],[-580,-10],[20,-10],[-580,370],[20,370]];
 layout.forEach(([x,y],i)=>{const p=el('div','panel',W,{left:x+'px',top:y+'px'});const r=rng(i*97+5);
  const pt=el('div','pt',p);pt.textContent=i%2?'Графики':'Продуктивность';
  el('div','sk',p,{left:'24px',top:'42px',width:(200+r()*60)+'px',background:'#a8a8a8',height:'7px'});
  const DS=DATA[i===2?0:i===7?1:(i%3===0?2:i%3===1?0:1)];
  const kpis=[];for(let k=0;k<3;k++){const kp=el('div','kpi',p,{left:(24+k*176)+'px',top:'62px'});
   const l=el('div','kl',kp);l.textContent=['Всего продаж','Чистый объём продаж','Заказы'][k];
   const v=el('div','kv',kp);v.textContent=[DS[0],DS[0],DS[1]][k];kpis.push(kp)}
  const svg=svgEl('svg',{width:512,height:160},p);
  for(let g=0;g<4;g++)svgEl('line',{x1:0,x2:512,y1:20+g*40,y2:20+g*40,stroke:'#b8b8b8','stroke-width':1},svg);
  const d=chartPath(i*13+3,512,150);
  const gray=svgEl('path',{d,fill:'none',stroke:'#8a8a8a','stroke-width':2.2,'stroke-linejoin':'round'},svg);
  const green=svgEl('path',{d,fill:'none',stroke:'#2bff4f','stroke-width':3.4,'stroke-linejoin':'round',style:'filter:drop-shadow(0 0 4px #2bff4f)'},svg);
  const len=green.getTotalLength?2000:2000;green.setAttribute('stroke-dasharray',len);green.setAttribute('stroke-dashoffset',len);
  dpan.push({p,kpis,green,len})})})();
// focus panels: 4 (lit at 4.44, green 4.74), 5 (5.86), 7 (kpi glow 6.54/6.82), 2 (kpi glow 3.84)
function panelCenter(i){const p=dpan[i].p;return[parseFloat(p.style.left)+280,parseFloat(p.style.top)+170]}
function renderDash(t){const S=$('dash');const on=t>=DASH[0]&&t<DASH[1];S.style.display=on?'block':'none';if(!on)return;
 // iris reveal from the face
 const ip=eOut(lin(t,3.38,3.72));S.style.clipPath=ip<1?`circle(${ip*900}px at 360px 560px)`:'none';
 // camera: [t, [fx,fy,scale,rotZ,rotX]]
 const c2=panelCenter(2),c4=panelCenter(4),c5=panelCenter(5),c7=panelCenter(7);
 const cam=kf(t,[[3.42,[c2[0]+40,c2[1]-120,1.25,-9,24]],[3.95,[c2[0]+20,c2[1]-40,1.15,-8,26]],
   [4.44,[c4[0]+60,c4[1]+30,1.25,-6,24]],[5.30,[c4[0]+90,c4[1]+50,1.45,-5,20]],
   [5.86,[c5[0]-20,c5[1]+60,1.2,-9,26]],[6.45,[c5[0]-60,c5[1]+120,1.1,-10,28]],
   [6.90,[c7[0]-120,c7[1]-40,1.55,-7,22]],[7.40,[c7[0]-150,c7[1]-10,1.7,-6,20]]]);
 const [fx,fy,sc,rz,rx]=cam;
 $('dworld').style.transform=`rotateX(${rx}deg) rotateZ(${rz}deg) scale(${sc}) translate(${-fx}px,${-fy}px)`;
 // lit panels & charts
 dpan.forEach((d,i)=>{let lit=0,draw=0;
  if(i===4){lit=lin(t,4.44,4.6);draw=lin(t,4.62,5.5)}
  if(i===5){lit=lin(t,5.86,6.0);draw=lin(t,5.9,6.6)}
  if(i===7){draw=lin(t,6.5,7.3)}
  if(i===2){draw=lin(t,3.6,4.4)}
  d.p.style.background=lit>0?`rgb(${mix(178,246,lit)},${mix(178,246,lit)},${mix(178,246,lit)})`:'#b2b2b2';
  d.p.style.boxShadow=lit>0?`0 0 ${30*lit}px ${10*lit}px rgba(255,255,255,${.55*lit}),0 20px 50px rgba(0,0,0,.6)`:'0 20px 50px rgba(0,0,0,.6)';
  d.green.setAttribute('stroke-dashoffset',d.len*(1-eOut(draw)));d.green.style.opacity=draw>0?1:0;
